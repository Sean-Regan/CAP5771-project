<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Store Price vs Nutrient Content</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.21.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.21.0/mapbox-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const MAPBOX_API_KEY = "{{ MAPBOX_API_KEY }}"
        const ENDPOINT = "http://localhost:8000"
    </script>
</head>

<body>
    <div class="container mt-5">
        <div class="card p-4">

            <h3>Grocery Store Price vs Nutrient Analysis</h3>

            <form id="predictionForm">
                <label for="name" class="form-label">Product Name</label>
                <input id="name" class="form-control mb-2" type="text">

                <label for="brand" class="form-label">Product Brand</label>
                <input id="brand" class="form-control mb-2" type="brand">

                <button class="btn btn-primary">Filter</button>
            </form>

            <div style="width: 800px"><canvas id="chartContainer"></canvas></div>

        </div>
        <div id="map" style="width: 800px; height: 600px;"></div>
    </div>
</body>

<script>
    // sets the access token, associating the map with your Mapbox account and its permissions
    mapboxgl.accessToken = MAPBOX_API_KEY;

    // creates the map, setting the container to the id of the div you added in step 2, and setting the initial center and zoom level of the map
    const map = new mapboxgl.Map({
        container: 'map', // container ID
        center: [-71.06776, 42.35816], // starting position [lng, lat]. Note that lat must be set between -90 and 90
        zoom: 9 // starting zoom
    });

    map.on('load', () => {
          map.addSource('clusters-source', {
        'type': 'geojson',
        'data': `${ENDPOINT}/api/get-clusters.geojson`
    });

    map.addLayer({
        'id': 'circle-layer',
        'type': 'circle',
        'source': 'clusters-source',
        'paint': {
            'circle-radius': 6,
            'circle-color': [
                'interpolate',
                ['linear'],
                ['get', 'cluster'],
                0, '#f80404',
                30, '#46c2f0',
                
            ],
            // 'circle-color': '#46c2f0',
            'circle-stroke-width': 2,
            'circle-stroke-color': 'white'
        }
    });  
    })
</script>

<script>
    const ctx = document.getElementById('chartContainer');

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Red', 'Blue', 'Yellow', 'Green', 'Purple', 'Orange'],
            datasets: [{
                label: '# of Votes',
                data: [12, 19, 3, 5, 2, 3],
                borderWidth: 1
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });
</script>

</html>
