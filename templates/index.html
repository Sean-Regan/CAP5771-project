<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Store Price vs Nutrient Content</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.21.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.21.0/mapbox-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        // All constants from Flask can go here and be read by static JS
        const MAPBOX_API_KEY = "{{ MAPBOX_API_KEY }}"
        const ENDPOINT = "{{ ENDPOINT }}"
    </script>
</head>

<body>
    <ul class="nav nav-tabs justify-content-center">
        <li class="nav-item">
            <a class="nav-link active" data-bs-toggle="tab" href="#cluster">Clustering Map</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" data-bs-toggle="tab" href="#analysis">Nutrient Analysis</a>
        </li>
    </ul>

    <div class="tab-content">
        <div id="cluster" class="tab-pane fade show active">
            <div class="container mt-5">
                <div class="card p-4">

                    <h3>Clustering Map</h3>

                    <div id="map-overlay"></div>
                    <div id="map" style="width: 800px; height: 600px;"></div>

                </div>
            </div>
        </div>
        <div id="analysis" class="tab-pane fade">
            <div class="container mt-5">
                <div class="card p-4">

                    <h3>Grocery Store Price vs Nutrient Analysis</h3>

                    <form id="nutrientForm">
                        <label for="product_name" class="form-label">Product Name</label>
                        <input id="product_name" class="form-control mb-2" type="text">

                        <label for="nutrient" class="form-label">Nutrient</label>
                        <input id="nutrient" class="form-control mb-2" type="text">

                        <button type="submit" class="btn btn-primary btn-lg">Filter</button>
                    </form>

                    <div style="width: 800px"><canvas id="chartContainer"></canvas></div>
                </div>
            </div>
        </div>
    </div>
</body>

<script src="{{ ENDPOINT }}/static/map.js"></script>
<link href="{{ ENDPOINT }}/static/map.css" rel="stylesheet">

<script>
    let chart = null;

    function groupByStore(data) {
        const groups = { "Walmart": [], "Whole Foods": [] };

        data.forEach(d => {
            groups[d.store].push({
                x: d.x,
                y: d.y,
                label: d.label,
                zip: d.zip
            });
        });

        // Assign colors per store
        const colors = {
            "Walmart": "rgba(0, 123, 255, 0.7)",      // blue
            "Whole Foods": "rgba(40, 167, 69, 0.7)"   // green
        };

        return Object.entries(groups).map(([store, points]) => ({
            label: store,
            data: points,
            backgroundColor: colors[store],
            borderColor: colors[store],
            pointRadius: 5
        }));
    }

    document.getElementById('nutrientForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const params = new URLSearchParams();
        params.append("name", product_name.value)
        params.append("nutrient", nutrient.value)

        try {
            const res = await fetch(`{{ ENDPOINT }}/api/nutrient_info?${params}`)
            const data = await res.json();
            if (data.error) throw new Error(data.error);
            const datasets = groupByStore(data);

            if (chart) {
                chart.destroy();
            }

            chart = new Chart(document.getElementById("chartContainer"), {
                type: "scatter",
                data: { datasets },
                options: {
                    parsing: false,
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: function (context) {
                                    const p = context.raw;
                                    return `${p.label} (ZIP: ${p.zip})`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { title: { display: true, text: "Price" } },
                        y: { title: { display: true, text: "Amount" } }
                    }
                }
            });
        } catch (err) {
            alert(err.message);
        }
    })
</script>

</html>
