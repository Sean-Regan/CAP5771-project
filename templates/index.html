<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Store Price vs Nutrient Content</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.21.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.21.0/mapbox-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        // All constants from Flask can go here and be read by static JS
        const MAPBOX_API_KEY = "{{ MAPBOX_API_KEY }}"
        const ENDPOINT = "{{ ENDPOINT }}"
    </script>
    <script src="{{ ENDPOINT }}/static/map.js"></script>
    <link href="{{ ENDPOINT }}/static/map.css" rel="stylesheet">
</head>

<body>
    <ul class="nav nav-tabs justify-content-center">
        <li class="nav-item">
            <a class="nav-link active" data-bs-toggle="tab" href="#cluster">Clustering Map</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" data-bs-toggle="tab" href="#analysis">Nutrient Analysis</a>
        </li>
    </ul>

    <div class="tab-content">
        <div id="cluster" class="tab-pane fade show active">
            <div class="container mt-5">
                <div class="card p-4">

                    <h3>Clustering Map</h3>

                    <div id="map-overlay"></div>
                    <div id="map" style="width: 800px; height: 600px;"></div>

                </div>
            </div>
        </div>
        <div id="analysis" class="tab-pane fade">
            <div class="container mt-5">
                <div class="card p-4">

                    <h3>Grocery Store Price vs Nutrient Analysis</h3>

                    <form id="predictionForm">
                        <label for="name" class="form-label">Product Name</label>
                        <input id="name" class="form-control mb-2" type="text">

                        <label for="brand" class="form-label">Product Brand</label>
                        <input id="brand" class="form-control mb-2" type="brand">

                        <button class="btn btn-primary">Filter</button>
                    </form>

                    <div style="width: 800px"><canvas id="chartContainer"></canvas></div>
                </div>
            </div>
        </div>
    </div>
</body>

<script>
    const ctx = document.getElementById('chartContainer');

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Red', 'Blue', 'Yellow', 'Green', 'Purple', 'Orange'],
            datasets: [{
                label: '# of Votes',
                data: [12, 19, 3, 5, 2, 3],
                borderWidth: 1
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });
</script>

</html>
